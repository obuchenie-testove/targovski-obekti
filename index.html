<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Търговски обекти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: инструмент — лента отгоре, филтри вляво, карта вдясно, анализ под картата */
:root {
  --bg: #eef1ef; --panel: #ffffff; --fg: #18211f; --muted: #5d6b67; --line: #d5ddd9;
  --accent: #1d6b5f; --accent-fg: #ffffff; --accent-soft: #dcece8; --warn: #a1620f; --bad: #b3362b; --chip: #f4f7f5;
  --tile-filter: none; --shadow: 0 8px 30px rgba(20,40,35,.18); --opp: #d9480f;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111615; --panel: #1a211f; --fg: #e3ebe8; --muted: #93a39e; --line: #2c3633;
  --accent: #5fc0ad; --accent-fg: #0d1a17; --accent-soft: #1f3631; --warn: #e0a24a; --bad: #ef7a6e; --chip: #212a28;
  --tile-filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); --shadow: 0 8px 30px rgba(0,0,0,.5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111615; --panel: #1a211f; --fg: #e3ebe8; --muted: #93a39e; --line: #2c3633;
  --accent: #5fc0ad; --accent-fg: #0d1a17; --accent-soft: #1f3631; --warn: #e0a24a; --bad: #ef7a6e; --chip: #212a28;
  --tile-filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); --shadow: 0 8px 30px rgba(0,0,0,.5); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-body); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 14px; }
h1 { font: 700 18px/1.1 var(--font-display); margin: 0 6px 0 0; letter-spacing: -.01em }
h2 { font: 600 12px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 10px }
select, input[type=text], input[type=number], input[type=password] { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0 }
button { font: inherit; cursor: pointer }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; padding: 7px 12px; white-space: nowrap }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600 }
.btn:disabled { opacity: .5; cursor: default }
.spacer { flex: 1 }
.meta { color: var(--muted); font-size: 13px }
.tabnum { font-variant-numeric: tabular-nums }

.main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; height: 68vh; overflow-y: auto; overflow-x: hidden; }
aside section { padding: 12px 14px; border-bottom: 1px solid var(--line) }
.cats { display: grid; gap: 2px }
.grp { border-top: 1px solid var(--line); padding: 2px 0 }
.grp:first-child { border-top: 0 }
.grp-h { display: flex; align-items: center; gap: 8px; padding: 4px }
.grp-h input { margin: 0; accent-color: var(--accent) }
.grp-t { background: none; border: 0; padding: 0; color: var(--fg); font: 600 13.5px/1.3 var(--font-body); text-align: left; flex: 1; cursor: pointer }
.grp-t .chev { color: var(--muted); font-size: 11px }
.grp-h .n { color: var(--muted); font-variant-numeric: tabular-nums }
.grp-b { padding: 0 0 4px 18px }
.cat { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 5px; cursor: pointer; }
.cat:hover { background: var(--chip) }
.cat input { margin: 0; accent-color: var(--accent) }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block }
.cat .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 0; font-size: 12px }
.toggle { display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: 13px }
.toggle input { accent-color: var(--accent) }
#brand { width: 100% }
.list { overflow-y: auto; flex: 1 0 auto; min-height: 140px; max-height: 320px; padding: 6px 6px 10px }
.item { padding: 7px 8px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 8px; align-items: baseline }
.item:hover, .item.on { background: var(--accent-soft) }
.item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.item .a { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums }

.mapbox { position: relative; height: 68vh; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line) }
#map { position: absolute; inset: 0; background: var(--bg) }
.street-tiles { filter: var(--tile-filter) }
.leaflet-control-layers { background: var(--panel); color: var(--fg); border-color: var(--line) !important }
.float { position: absolute; z-index: 500; background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow) }
.detail { top: 12px; right: 12px; width: min(330px, calc(100% - 24px)); max-height: calc(100% - 24px); overflow: auto; padding: 14px 16px }
.detail h3 { font: 600 16px/1.25 var(--font-body); margin: 0 30px 4px 0 }
.close { position: absolute; top: 8px; right: 10px; background: none; border: 0; font-size: 20px; color: var(--muted) }
.kv { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 5px 10px; margin-top: 10px; font-size: 13px }
.kv dt { color: var(--muted) } .kv dd { margin: 0; overflow-wrap: anywhere }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--chip); border: 1px solid var(--line); margin: 0 4px 2px 0 }
.pill.m { border-color: var(--accent); color: var(--accent) }
.pill.t { border-color: var(--warn); color: var(--warn) }
a { color: var(--accent) }

.progress { left: 50%; bottom: 16px; transform: translateX(-50%); padding: 10px 16px; font-size: 13px; width: min(420px, calc(100% - 24px)) }
.progress .barl { height: 4px; background: var(--chip); border-radius: 2px; margin-top: 8px; overflow: hidden }
.progress .barl i { display: block; height: 100%; width: 30%; background: var(--accent); animation: slide 1.2s ease-in-out infinite }
@keyframes slide { 0% { margin-left: -30% } 100% { margin-left: 100% } }
@media (prefers-reduced-motion: reduce) { .progress .barl i { animation: none; width: 100% } }

/* модален прозорец */
.modal { position: fixed; inset: 0; z-index: 2000; background: rgba(10,20,18,.45); display: grid; place-items: center; padding: 16px }
.dialog { background: var(--panel); color: var(--fg); border-radius: 10px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 20px 22px; position: relative }
.dialog h3 { font: 700 16px/1.2 var(--font-display); margin: 0 0 14px }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; color: var(--muted) }
.tabs button.on { color: var(--fg); border-color: var(--accent) }
.field { display: grid; gap: 5px; margin-bottom: 12px }
.field label { font-size: 13px; color: var(--muted) }
.hint { font-size: 12px; color: var(--muted); margin: 0 0 12px; max-width: 65ch }
.err { color: var(--bad); font-size: 13px; margin: 6px 0 }
.ok { color: var(--accent); font-size: 13px; margin: 6px 0 }

.analysis { margin-top: 14px; padding-bottom: 28px; display: grid; gap: 14px }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px }
.tile .v { font: 600 24px/1.1 var(--font-body); font-variant-numeric: tabular-nums; margin-top: 4px }
.tile .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em }
.tile .s { color: var(--muted); font-size: 12px; margin-top: 4px }
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0 }
.scroll { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
th:first-child, td:first-child { text-align: left }
th { color: var(--muted); font-weight: 500; font-size: 12px }
tr.grp-row td { font-weight: 600; background: var(--chip) }
td input { width: 110px; padding: 4px 6px }
.bar { height: 6px; border-radius: 3px; display: flex; overflow: hidden; background: var(--chip); min-width: 80px }
.bar i { display: block; height: 100% }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; max-width: 75ch }
input[type=range] { accent-color: var(--accent); width: 140px }
.empty { padding: 30px 20px; text-align: center; color: var(--muted) }
.opp { top: 12px; left: 56px; width: min(320px, calc(100% - 68px)); max-height: calc(100% - 24px); overflow: auto; padding: 12px 14px }
.opp h3 { font: 600 14px/1.25 var(--font-body); margin: 0 26px 2px 0 }
.opp ol { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px }
.opp li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 7px 8px; border-radius: 6px; cursor: pointer; border: 1px solid var(--line) }
.opp li:hover, .opp li:focus-visible { border-color: var(--opp) }
.opp .rank { width: 22px; height: 22px; border-radius: 50%; background: var(--opp); color: #fff; display: grid; place-items: center; font: 700 12px/1 var(--font-body) }
.opp .why { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.opp-legend { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 8px }
.opp-legend i { flex: 1; height: 6px; border-radius: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--opp) 15%, transparent), var(--opp)) }
.opp-pin { background: var(--opp); color: #fff; border: 2px solid #fff; border-radius: 50%; width: 26px !important; height: 26px !important; display: grid; place-items: center; font: 700 13px/1 "Golos Text", system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.35) }
#lp li { display: flex; grid-template-columns: none; border: 0; gap: 8px }
#lp .dot { flex: none; width: 10px; height: 10px }
#lp li > .why { flex: none }
.lp-list, .lp-near { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px }
.lp-list { max-height: 260px; overflow-y: auto }
.lp-list li, .lp-near li { display: flex; align-items: baseline; gap: 8px; padding: 5px 6px; border-radius: 5px; cursor: pointer; font-size: 13px }
.lp-list li > span:first-child, .lp-near li > span:first-of-type { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.lp-near li { cursor: default } .lp-near li[data-shop] { cursor: pointer }
.lp-list li:hover, .lp-list li.on, .lp-near li[data-shop]:hover { background: var(--accent-soft) }
.lp-sel { margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px }
.lp-h { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 12px }
.kv2 { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums }
.kv2 span { color: var(--muted) } .kv2 b { text-align: right; font-weight: 600 }
.spark { display: flex; align-items: flex-end; gap: 4px; height: 34px; margin-top: 6px }
.spark i { flex: 1; background: color-mix(in srgb, #a855f7 35%, var(--chip)); border-radius: 2px 2px 0 0; min-height: 2px }
.spark i.on { background: #7a1fa2 }
.pop .spark { height: 26px; margin: 2px 0 6px }
.pop .spark i { background: color-mix(in srgb, var(--accent) 55%, var(--chip)) }
.seg { display: flex; gap: 0; margin-top: 10px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.seg button { flex: 1; border: 0; background: var(--panel); color: var(--fg); padding: 6px 4px; font-size: 13px }
.seg button + button { border-left: 1px solid var(--line) }
.seg button.on { background: var(--accent); color: var(--accent-fg) }
.lybtns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px }
.lybtns .btn { padding: 7px 6px; font-size: 13px }
.lybtns .btn.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
.demo-badge { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--opp); border: 1px solid var(--opp); border-radius: 99px; padding: 2px 8px }
.navlink { color: var(--accent); font-weight: 600; text-decoration: none; white-space: nowrap }
.navlink:hover { text-decoration: underline }
.welcome { left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 20px 22px; width: min(400px, calc(100% - 24px)); text-align: center }
.welcome p { color: var(--muted); margin: 8px 0 14px }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr) }
  aside { height: auto } .list { max-height: 260px }
  .mapbox { height: 60vh; order: -1 }
  .cols { grid-template-columns: minmax(0, 1fr) }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Търговски обекти</h1>
    <span class="demo-badge" id="demoBadge" hidden title="Примерни данни, събрани предварително">Демо</span>
    <select id="area" aria-label="Зона"></select>
    <button class="btn primary" id="btnNew">+ Нова зона</button>
    <button class="btn" id="btnRefresh" title="Събери отново данните за тази зона">Обнови зоната</button>
    <span class="meta" id="meta"></span>
    <span class="spacer"></span>
    <a class="navlink" href="kak-e-napraveno.html">Как работи →</a>
    <button class="btn" id="btnNsi">Данни НСИ</button>
    <button class="btn" id="btnNtr">Хотели (НТР)</button>
    <button class="btn" id="btnImport">Импорт</button>
    <button class="btn" id="btnExport">Експорт</button>
    <button class="btn" id="btnSettings" aria-label="Настройки">Настройки</button>
  </header>

  <div class="main">
    <aside>
      <section>
        <div class="row" style="justify-content:space-between"><h2 style="margin:0">Бранш</h2>
          <span><button class="linkbtn" id="all">всички</button> · <button class="linkbtn" id="none">нито един</button></span></div>
        <div class="cats" id="cats" style="margin-top:8px"></div>
      </section>
      <section style="display:grid;gap:8px">
        <h2 style="margin:0">Марка</h2>
        <input type="text" id="brand" list="brands" placeholder="Всички марки">
        <datalist id="brands"></datalist>
        <label class="toggle"><input type="checkbox" id="chains"> Само вериги (2+ обекта)</label>
        <label class="toggle"><input type="checkbox" id="inmall"> Само в молове</label>
        <label class="toggle"><input type="checkbox" id="showstay"> Покажи хотелите</label>
      </section>
      <section style="display:grid;gap:8px">
        <h2 style="margin:0">Къде липсва?</h2>
        <div class="row"><select id="oppCat" aria-label="Бранш за картата на възможностите" style="flex:1"></select><button class="btn" id="oppBtn">Покажи</button></div>
      </section>
      <section style="display:grid;gap:8px">
        <h2 style="margin:0">Хората</h2>
        <div class="lybtns"><button class="btn" data-ly="hotels">Хотели</button><button class="btn" data-ly="heat">Насищане</button><button class="btn" data-ly="flow">Потоци</button></div>
      </section>
      <div class="list" id="list"></div>
    </aside>
    <div class="mapbox">
      <div id="map"></div>
      <div class="float detail" id="detail" hidden></div>
      <div class="float opp" id="opp" hidden></div>
      <div class="float opp" id="lp" hidden></div>
      <div class="float progress" id="progress" hidden><span id="progressText">Събиране…</span><div class="barl"><i></i></div></div>
      <div class="float welcome" id="welcome" hidden>
        <h3 style="font:700 16px/1.2 var(--font-display);margin:0">Няма събрани зони</h3>
        <p>Избери място и системата ще намери магазините, сградите и хотелите в него.</p>
        <button class="btn primary" id="btnWelcome">Събери Слънчев бряг</button>
      </div>
    </div>
  </div>

  <div class="analysis" id="analysis"></div>
</div>

<div class="modal" id="modal" hidden><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
<input type="file" id="fileGeo" accept=".kml,.kmz,.geojson,.json,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="fileNsi" accept=".csv,text/csv" multiple hidden>
<input type="file" id="fileNtr" accept=".csv,.tsv,.txt,text/csv,text/plain" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="demo/demo.js"></script>
<script src="data/ntr.js"></script>
<script>
"use strict";
/* =====================================================================
   НАСТРОЙКИ: браншове, зони, типични площи
   ===================================================================== */
// Общи категории (групи) и браншове. shop/amenity/office са таговете в OpenStreetMap; size = мин., типична, макс. площ в м²
const GROUPS = {

  dom:      { label: "Дом, техника и книги" },

};
const CATEGORIES = {
  drehi:      { g: "moda",      label: "Дрехи",                   color: "#2f6fd6", shop: ["clothes", "fashion", "boutique"],                       size: [25, 120, 2500] },
  obuvki:     { g: "moda",      label: "Обувки",                  color: "#5b8def", shop: ["shoes"],                                                 size: [20, 80, 800] },
  bijuta:     { g: "moda",      label: "Бижута и часовници",      color: "#1c4fa8", shop: ["jewelry", "watches"],                                     size: [8, 35, 250] },
  aksesoari:  { g: "moda",      label: "Чанти и аксесоари",       color: "#7aa7f5", shop: ["bag", "leather", "fashion_accessories"],                 size: [10, 40, 300] },
  kozmetika:  { g: "krasota",   label: "Козметика и парфюмерия",  color: "#d1477a", shop: ["cosmetics", "perfumery", "chemist"],                     size: [20, 70, 600] },
  studia:     { g: "krasota",   label: "Козметични студиа",       color: "#e86f9d", shop: ["beauty", "hairdresser", "massage", "tattoo", "nails"],   size: [12, 45, 300] },
  optika:     { g: "krasota",   label: "Оптика",                  color: "#a8325e", shop: ["optician"],                                               size: [15, 50, 250] },

  alkohol:    { g: "hrana",     label: "Алкохол и тютюн",         color: "#1b5e2a", shop: ["alcohol", "wine", "beverages", "tobacco", "e-cigarette"], size: [15, 50, 400] },
  restoranti: { g: "zavedenia", label: "Ресторанти",              color: "#c2410c", amenity: ["restaurant", "food_court"],                          size: [60, 180, 1500] },

.shops out geom;
.stay out geom;
(way["building"](around.shops:15); way["building"](around.stay:15);)->.blds;
.blds out geom;
nwr["shop"="mall"](${bb});

}

async function fetchOverpass(bbox, onStep) {

    for (const url of [DB.settings.overpass, ...OVERPASS].filter(Boolean)) {
      try {
        onStep(`Свързване с ${new URL(url).host}…`);
        const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 200000);
        const r = await fetch(url, { method: "POST", body, signal: ctl.signal });
        clearTimeout(t);
        if (!r.ok) throw new Error("HTTP " + r.status);
        onStep("Обработка на данните…");
        return await r.json();
      } catch (e) { last = e; await sleep(1500); }
    }
    onStep("Сървърите са натоварени, нов опит след 20 секунди…");
    await sleep(20000);
  }
  throw new Error("OpenStreetMap не отговаря (" + (last && last.message) + "). Опитай след малко.");
}

function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const first = text.split("\n")[0], cnt = (re) => (first.match(re) || []).length;
  const sep = [["\t", cnt(/\t/g)], [";", cnt(/;/g)], [",", cnt(/,/g)]].sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map((h) => h.trim().toLowerCase());
  return rows.filter((r) => r.some((x) => x.trim())).map((r) => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));

  const opp = {};
  for (const g of Object.keys(GROUPS)) {
    const r = oppCompute(a, "g:" + g);
    opp[g] = r.spots.map((c) => ({ lat: r1(c.la, 5), lon: r1(c.lo, 5), beds_400m: Math.round(c.near), shops_400m: c.cnt, nearest: c.nearest ? c.nearest.name : null, nearest_m: isFinite(c.nd) ? Math.round(c.nd) : null }));
  }

    sources: {

      ntr: a.ntr && a.ntr.length ? { source: a.ntrSource || "", records: a.ntr.length, beds_total: a.ntr.reduce((t, r) => t + (r.beds || r.rooms * 2), 0) } : null,
      nsi: R ? { resort: a.nsiResort, sources: R.sources } : null,
    },
    groups: Object.fromEntries(Object.entries(GROUPS).map(([k, v]) => [k, v.label])),
    categories: Object.fromEntries(Object.entries(CATEGORIES).map(([k, v]) => [k, { label: v.label, group: v.g, typical_m2: v.size[1] }])),
    shops: a.shops.map((s) => ({ id: s.id, name: s.name, brand: s.brand || null, cat: s.cat, group: CATEGORIES[s.cat] && CATEGORIES[s.cat].g, lat: s.lat, lon: s.lon,
      area_m2: s.area, area_method: s.area_conf, area_err: r1(errOf(s), 2), area_confirmed: s.area_true || null, mall: s.mall || null,
      address: s.address || null, phone: s.phone || null, website: s.website || null, hours: s.hours || null, sources: s.sources,
      flow_per_day: LY.exposure.has(s.id) ? Math.round(LY.exposure.get(s.id)) : null, popular_hours: s.popular || null })),
    stays: a.stays.map((h) => ({ name: h.ntrName || h.name || null, beds: h.beds, beds_source: h.beds_how, stars: h.stars || null, lat: h.lat, lon: h.lon })),
    malls: a.malls.map((m) => ({ name: m.name, lat: r1(m.lat, 5), lon: r1(m.lon, 5), footprint_m2: m.area })),
    other_shops_count: a.other_shops,
    coverage: { samples: a.samples || [], rate: C ? r1(C.rate, 3) : null },
    calibration: CAL,
    nsi: R ? { resort: a.nsiResort, annual: R.annual, monthly: R.monthly, quarterly: R.quarterly, summary: S ? { year: S.Y, occupancy: r1(S.occupancy, 3), avg_stay_nights: r1(S.stay, 2), peak_month: S.peak ? S.peak.m : null } : null } : null,
    guests_by_month: months,
    bed_base: bedBase(a),
    opportunities_by_group: opp,
    flows: LY.exposure.size ? { time_of_day: LY.tod, month: LY.month, note: "flow_per_day при обектите е от модела на пешеходните потоци" } : null,
    notes: [
      "Всички площи без area_confirmed са оценки; area_err е относителната грешка (0.35 = ±35%).",
      "Гостите са нощуващи в регистрирани места за настаняване; еднодневните посетители не са включени.",
      "Броят обекти е колкото познават източниците; coverage.rate (ако има) е делът на познатите спрямо реалните.",
    ],
  };
}
// KML: папка за всяка обща категория, бранш в описанието; отваря се в Google My Maps и Google Earth
function exportKML(a) {
  const x = (t) => String(t ?? "").replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
  const folders = Object.entries(GROUPS).map(([g, G]) => {
    const pts = a.shops.filter((s) => CATEGORIES[s.cat] && CATEGORIES[s.cat].g === g);
    if (!pts.length) return "";
    return `<Folder><name>${x(G.label)}</name>${pts.map((s) => `<Placemark><name>${x(s.name)}</name><description>${x([CATEGORIES[s.cat].label, s.brand && "Марка: " + s.brand, s.address, s.phone, s.website, "Площ ≈ " + s.area + " м² (" + s.area_conf + ")", "Източници: " + s.sources.join(", ")].filter(Boolean).join("\n"))}</description><Point><coordinates>${s.lon},${s.lat},0</coordinates></Point></Placemark>`).join("")}</Folder>`;
  }).join("");
  const hotels = a.stays.length ? `<Folder><name>Места за настаняване</name>${a.stays.map((h) => `<Placemark><name>${x(h.ntrName || h.name || "(без име)")}</name><description>${x(`${h.beds} легла (${h.beds_how})${h.stars ? ", " + h.stars : ""}`)}</description><Point><coordinates>${h.lon},${h.lat},0</coordinates></Point></Placemark>`).join("")}</Folder>` : "";
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${x(a.name)} — търговски обекти</name><description>${x("Събрано " + a.collected + ". Източници: OpenStreetMap (ODbL), Overture Maps, вериги, НТР.")}</description>${folders}${hotels}</Document></kml>`;
}
function exportCSV(a) {
  const head = ["име", "марка", "бранш", "lat", "lon", "адрес", "телефон", "сайт", "работно време", "мол", "площ м²", "точност на площта", "източници"];
  const lines = [head.join(",")].concat(a.shops.map((r) => [r.name, r.brand, CATEGORIES[r.cat].label, r.lat, r.lon, r.address, r.phone, r.website, r.hours, r.mall, r.area, r.area_conf, r.sources.join(" + ")].map(csvCell).join(",")));

}

function readLD(html) {
  const out = {}, doc = new DOMParser().parseFromString(html, "text/html");
  out.title = (doc.querySelector("title")?.textContent || "").trim().slice(0, 150);
  const found = [];
  const walk = (o) => {
    if (Array.isArray(o)) return o.forEach(walk);
    if (!o || typeof o !== "object") return;
    const ts = [].concat(o["@type"] || []);
    if (ts.some((t) => typeof t === "string" && (t.endsWith("Store") || ["LocalBusiness", "BeautySalon", "HairSalon", "DaySpa", "NailSalon", "ShoppingCenter"].includes(t)))) found.push(o);
    Object.values(o).forEach((v) => typeof v === "object" && walk(v));
  };
  doc.querySelectorAll('script[type="application/ld+json"]').forEach((s) => { try { walk(JSON.parse(s.textContent)); } catch (e) {} });
  const ld = found[0];
  if (ld) {
    const ad = ld.address;
    if (ad && typeof ad === "object") out.address = [ad.streetAddress, ad.addressLocality].filter(Boolean).join(", ");
    if (ld.telephone) out.phone = String(ld.telephone);
    if (ld.openingHours) out.hours = [].concat(ld.openingHours).join("; ");
    const fs = ld.floorSize; if (fs && fs.value) out.floor = parseFloat(fs.value);
  }
  return out;
}
async function enrichArea(a, onStep) {
  const { proxy, proxyKey } = DB.settings;
  const urls = [...new Set(a.shops.map((s) => s.website).filter(Boolean))];
  const info = {}; let done = 0;
  const work = urls.slice(), worker = async () => {
    while (work.length) {
      const u = work.shift();
      try {
        const r = await fetch(`${proxy}?key=${encodeURIComponent(proxyKey)}&url=${encodeURIComponent(/^https?:/.test(u) ? u : "http://" + u)}`);
        if (r.ok) info[u] = readLD(await r.text());
      } catch (e) {}
      onStep(`Проверени сайтове: ${++done} от ${urls.length}`);
    }
  };
  await Promise.all(Array.from({ length: 5 }, worker));
  let n = 0;
  for (const s of a.shops) {
    const i = info[s.website]; if (!i) continue;
    n++; if (!s.sources.includes("Сайт")) s.sources.push("Сайт");
    for (const k of ["address", "phone", "hours"]) if (i[k] && !s[k]) s[k] = i[k];
    if (i.floor > 0) Object.assign(s, { area: Math.round(i.floor), area_conf: "от сайта", area_err: 0.1, area_note: "обявена площ в сайта" });
  }
  return n;
}

const state = { area: DB.ui.area, openGroups: new Set(["moda"]), cats: new Set(Object.keys(CATEGORIES)), brand: "", chains: false, inmall: false, showstay: false, sel: null, occ: DB.ui.occ || 0.8, busy: false };
let map, shopLayer, stayLayer, mallLayer;

function initMap() {
  map = L.map("map", { preferCanvas: true }).setView([42.7, 25.3], 7);
  // Подложки: Esri не изисква адрес на сайт, затова работи и когато страницата е отворена като файл.
  // Ако една подложка не се зарежда, страницата минава автоматично на следващата.
  const BASES = [
    ...(DB.settings.tileUrl ? [["Моята карта", DB.settings.tileUrl, { maxZoom: 20, className: "street-tiles", attribution: esc(DB.settings.tileAttr || "") }]] : []),
    ["Карта (Esri)", "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, className: "street-tiles", attribution: "Powered by Esri · &copy; Esri, HERE, Garmin, OpenStreetMap" }],
    ["Карта (CARTO)", "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", { maxZoom: 20, subdomains: "abcd", className: "street-tiles", attribution: "&copy; OpenStreetMap &copy; CARTO" }],
    ["Карта (Esri, светла)", "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16, className: "street-tiles", attribution: "Powered by Esri · &copy; Esri, HERE, Garmin, OpenStreetMap" }],
    ["Сателит", "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Powered by Esri · &copy; Esri, Maxar, Earthstar Geographics" }],
  ].map(([name, url, opt]) => ({ name, layer: L.tileLayer(url, opt), ok: false, err: 0 }));
  let current = null;
  function useBase(i) {
    if (current) map.removeLayer(current.layer);
    current = BASES[i]; current.layer.addTo(map); current.layer.bringToBack();
    try { DB.ui.base = i; persist(); } catch (e) {}
  }
  BASES.forEach((b, i) => {
    b.layer.on("tileload", () => { b.ok = true; });
    b.layer.on("tileerror", () => {
      if (b.ok || current !== b || ++b.err < 3) return;
      const next = BASES.findIndex((x, j) => j > i && !x.err);
      if (next > -1) { useBase(next); toastMeta(`Подложката „${b.name}“ не се зарежда; минах на „${BASES[next].name}“.`); }
      else toastMeta("Нито една подложка не се зарежда. Провери интернет връзката.");
    });
  });
  const ctl = L.control.layers(Object.fromEntries(BASES.map((b) => [b.name, b.layer])), null, { position: "bottomleft" }).addTo(map);
  map.on("baselayerchange", (e) => { current = BASES.find((b) => b.layer === e.layer); try { DB.ui.base = BASES.indexOf(current); persist(); } catch (x) {} });
  useBase(DB.settings.tileUrl ? 0 : Number.isInteger(DB.ui.base) && BASES[DB.ui.base] ? DB.ui.base : 0);
  shopLayer = L.layerGroup().addTo(map); stayLayer = L.layerGroup(); mallLayer = L.layerGroup().addTo(map);
}

function emptyHint() {
  const off = [];
  if (state.inmall) off.push("„Само в молове“");
  if (state.chains) off.push("„Само вериги“");
  if (state.brand) off.push("търсенето по марка");
  if (!state.cats.size) return "Не е избран нито един бранш.";
  return off.length ? `Няма обекти по тези филтри. Опитай без ${off.join(" и ")}.` : "Няма обекти в избраните браншове.";
}

   КАРТА НА ВЪЗМОЖНОСТИТЕ: къде има много гости наоколо, а малко обекти от бранша

   ===================================================================== */
const OPP = { R: 400, SIGMA: 250, CELL: 100 }; // радиус и мащаб в метри

way["highway"~"^(footway|pedestrian|path|steps|living_street|residential|service|unclassified|tertiary|secondary|primary|cycleway|track|tertiary_link|secondary_link)$"]["access"!~"^(private|no)$"](${bb})->.w;

function parseNSI(text, fileName) {
  const rows = parseCSV(text);
  if (!rows.length) return { resorts: 0, values: 0 };
  const keys = Object.keys(rows[0]);
  const kRes = keys[0], kCol = keys.find((k) => k.includes("колона")) || keys[1], kVal = keys.find((k) => k.includes("стойност")) || keys[2];
  const kSrc = keys.find((k) => k.includes("източник"));
  // месеци или тримесечия: ако във файла има римско число над IV, периодите са месеци
  const monthly = rows.some((r) => { const m = /^\d{4}([IVX]+)\s*\//.exec(r[kCol] || ""); return !!(m && ROMAN[m[1]] > 4); });
  DB.nsi = DB.nsi || {};
  let n = 0; const seen = new Set();
  for (const r of rows) {
    // „2012 / показател / мярка“ или „2008Q1 / мярка / показател“ — редът на частите не е еднакъв
    const parts = String(r[kCol] || "").split(" / ").map((x) => x.trim());
    if (parts.length < 2) continue;
    const per = /^(\d{4})(?:Q([1-4])|([IVX]+))?$/.exec(parts[0]); if (!per) continue;
    const rest = parts.slice(1), indIdx = rest.findIndex((x) => nsiKey(x));
    if (indIdx < 0) continue;
    const key = nsiKey(rest[indIdx]), unit = rest.filter((_, i) => i !== indIdx).join(" / ");
    const val = nsiNum(r[kVal]); if (val === null) continue;
    const resort = String(r[kRes] || "").trim(); if (!resort) continue;
    const R = DB.nsi[resort] = DB.nsi[resort] || { annual: {}, monthly: {}, quarterly: {}, sources: [] };
    const year = +per[1], isQ = !!per[2], sub = per[2] ? +per[2] : per[3] ? ROMAN[per[3]] : 0;
    const bucket = !sub ? (R.annual[year] = R.annual[year] || {}) :
      (monthly && !isQ) ? (R.monthly[`${year}-${String(sub).padStart(2, "0")}`] = R.monthly[`${year}-${String(sub).padStart(2, "0")}`] || {}) :
      (R.quarterly[`${year}-Q${sub}`] = R.quarterly[`${year}-Q${sub}`] || {});
    bucket[key] = val;
    if (key.startsWith("revenue")) bucket.revenue_unit = unit;
    const src = r[kSrc] ? urlV(String(r[kSrc]).split("?")[0]) : "";
    if (src && !R.sources.includes(src)) R.sources.push(src);
    seen.add(resort); n++;
  }
  return { resorts: seen.size, values: n, names: [...seen] };
}
function nsiFor(a) { return a && a.nsiResort && DB.nsi && DB.nsi[a.nsiResort] ? DB.nsi[a.nsiResort] : null; }
function guessResort(areaName) {
  const names = Object.keys(DB.nsi || {}), x = norm(areaName);
  return names.find((n) => { const y = norm(n); return y && (x.includes(y) || y.includes(x)); }) || "";
}
// обобщение за последната пълна година
function nsiSummary(R) {
  const years = Object.keys(R.annual).map(Number).filter((y) => R.annual[y].nights).sort((a, b) => a - b);
  if (!years.length) return null;
  const Y = years[years.length - 1], y = R.annual[Y];
  const months = [];
  for (let m = 1; m <= 12; m++) { const v = R.monthly[`${Y}-${String(m).padStart(2, "0")}`]; if (v && v.nights) months.push({ m, nights: v.nights }); }
  const peak = months.length ? months.reduce((a, b) => (b.nights > a.nights ? b : a)) : null;
  return {
    years, Y, y,
    occupancy: y.nights && y.bedDays ? y.nights / y.bedDays : null,
    stay: y.nights && y.persons ? y.nights / y.persons : null,
    peak, peakGuests: peak ? peak.nights / new Date(Y, peak.m, 0).getDate() : null,
  };
}
const short = (n) => n >= 1e6 ? (n / 1e6).toLocaleString("bg-BG", { maximumFractionDigits: 1 }) + " млн" : n >= 1e4 ? Math.round(n / 1e3).toLocaleString("bg-BG") + " хил" : fmt(n);

function barChart(items, label) {
  if (!items.length) return "";
  const max = Math.max(...items.map((d) => d.v)) || 1;
  const step = 58, W = Math.max(320, items.length * step + 32), H = 190, base = H - 28, bw = 38;
  const bars = items.map((d, i) => {
    const x = 16 + i * step + (step - bw) / 2, h = (d.v / max) * (H - 64), y = base - h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${d.hi ? "var(--accent)" : "color-mix(in srgb, var(--accent) 55%, var(--chip))"}"><title>${esc(d.l)}: ${fmt(d.v)}</title></rect>
      <text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" font-size="10.5" fill="var(--fg)">${short(d.v)}</text>
      <text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${esc(d.l)}</text>`;
  }).join("");
  return `<div class="scroll"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><line x1="12" x2="${W - 12}" y1="${base}" y2="${base}" stroke="var(--line)"/>${bars}</svg></div>`;
}

// Покритие: колко от реалните обекти познава OpenStreetMap, по контролни проби на място
function coverage(a) {
  const xs = (a.samples || []).filter((x) => x.real > 0);
  const osm = xs.reduce((t, x) => t + x.osm, 0), real = xs.reduce((t, x) => t + x.real, 0);
  return xs.length && real ? { n: xs.length, osm, real, rate: Math.min(1, osm / real) } : null;
}
function inBounds(s, b) { return s.lat >= b[0] && s.lat <= b[2] && s.lon >= b[1] && s.lon <= b[3]; }

function renderAnalysis(list) {
  const a = A(); if (!a) { $("analysis").innerHTML = ""; return; }
  a.tourism = a.tourism || []; a.samples = a.samples || [];
  drawSamples(a);
  const R = nsiFor(a), S = R ? nsiSummary(R) : null, C = coverage(a);
  const total = list.reduce((t, s) => t + s.area, 0);
  const lo = list.reduce((t, s) => t + s.area * (1 - errOf(s)), 0), hi = list.reduce((t, s) => t + s.area * (1 + errOf(s)), 0);
  const osmBeds = a.stays.reduce((t, h) => t + h.beds, 0);
  const useNsi = !!(S && S.peakGuests);
  const peak = useNsi ? S.peakGuests : osmBeds * state.occ;
  // площта, коригирана с покритието: необхванатите обекти се приемат със средната площ на познатите
  const totalAdj = C ? total / C.rate : total;
  const per1000 = (ar) => peak > 0 ? ar / (peak / 1000) : 0;
  const rows = Object.keys(CATEGORIES).filter((c) => state.cats.has(c)).map((c) => {
    const xs = list.filter((s) => s.cat === c), ar = xs.reduce((t, s) => t + s.area, 0), q = { m: 0, b: 0, t: 0 };
    xs.forEach((s) => s.area_conf === "типична" ? q.t++ : s.area_conf === "по сграда" ? q.b++ : q.m++);
    return { c, n: xs.length, ar, avg: xs.length ? ar / xs.length : 0, q, dens: per1000(C ? ar / C.rate : ar) };
  }).filter((r) => r.n);
  const brands = Object.entries(chainCounts(list)).filter(([, n]) => n >= 2).sort((x, y) => y[1] - x[1]).slice(0, 10);

  const ntrAll = (a.ntr || []).reduce((t, r) => t + (r.beds || r.rooms * 2), 0);
  const ntrMap = a.stays.filter((h) => h.beds_how === "НТР").reduce((t, h) => t + h.beds, 0);
  const ntrLine = a.ntr && a.ntr.length ? ` · регистър: ${fmt(ntrAll)} легла, ${fmt(ntrMap)} на картата` : "";

    ? `<div class="tile"><div class="l">Легла в зоната</div><div class="v">${fmt(S.y.beds)}</div><div class="s">НСИ ${S.Y}, ${fmt(S.y.places || 0)} места · по хотели ≈ ${fmt(osmBeds)}${ntrLine}</div></div>`
    : `<div class="tile"><div class="l">Легла в зоната</div><div class="v">≈ ${fmt(osmBeds)}</div><div class="s">${fmt(a.stays.length)} места за настаняване${ntrLine || " · оценка от OSM"}</div></div>`;
  const peakTile = useNsi
    ? `<div class="tile"><div class="l">Гости на нощ, пик</div><div class="v">${fmt(peak)}</div><div class="s">средно през ${MONTHS_FULL[S.peak.m - 1]} ${S.Y}, по нощувки от НСИ</div></div>`
    : `<div class="tile"><div class="l">Гости в пиков ден</div><div class="v">≈ ${fmt(peak)}</div><div class="s"><label for="occ">легла × заетост <span id="occPct">${Math.round(state.occ * 100)}%</span></label><br><input type="range" id="occ" min="0.2" max="1" step="0.05" value="${state.occ}"></div></div>`;
  const countTile = C
    ? `<div class="tile"><div class="l">Обекти</div><div class="v">≈ ${fmt(list.length / C.rate)}</div><div class="s">${fmt(list.length)} на картата · покритие ${Math.round(C.rate * 100)}% по ${C.n} ${C.n === 1 ? "проба" : "проби"}</div></div>`
    : `<div class="tile"><div class="l">Обекти</div><div class="v">поне ${fmt(list.length)}</div><div class="s">толкова познава OSM; реалните са повече — виж „Покритие“</div></div>`;
  const areaTile = C
    ? `<div class="tile"><div class="l">Търговска площ</div><div class="v">≈ ${fmt(totalAdj)} м²</div><div class="s tabnum">на картата ${fmt(total)} м² (${fmt(lo)}–${fmt(hi)})</div></div>`
    : `<div class="tile"><div class="l">Търговска площ</div><div class="v">поне ${fmt(total)} м²</div><div class="s tabnum">диапазон ${fmt(lo)}–${fmt(hi)} м²</div></div>`;
  const densTile = `<div class="tile"><div class="l">Площ на 1000 гости</div><div class="v">${peak > 0 ? fmt(per1000(totalAdj)) + " м²" : "—"}</div><div class="s">${C ? "с корекция за покритие" : "без корекция за покритие"}; сравнявай зони, не обекти</div></div>`;

  $("analysis").innerHTML = `
    <div class="tiles">
      ${countTile}${areaTile}
      <div class="tile"><div class="l">Средна площ</div><div class="v">${fmt(list.length ? total / list.length : 0)} м²</div><div class="s">на обект</div></div>
      ${bedsTile}${peakTile}${densTile}
    </div>
    <div class="cols">
      <div class="card"><h2>По бранш</h2><div class="scroll"><table>
        <thead><tr><th>Бранш</th><th>Обекти</th><th>Площ м²</th><th>Средно м²</th><th title="търговска площ на 1000 гости на нощ в пика">м² / 1000 гости</th><th>Точност на площта</th></tr></thead>
        <tbody>${Object.keys(GROUPS).map((g) => { const rs = rows.filter((r) => CATEGORIES[r.c].g === g); if (!rs.length) return ""; const n = rs.reduce((t, r) => t + r.n, 0), ar = rs.reduce((t, r) => t + r.ar, 0), dn = rs.reduce((t, r) => t + r.dens, 0);
          return `<tr class="grp-row"><td>${esc(GROUPS[g].label)}</td><td>${n}</td><td>${fmt(ar)}</td><td>${fmt(n ? ar / n : 0)}</td><td>${peak > 0 ? fmt(dn) : "—"}</td><td></td></tr>` + rs.map((r) => `<tr><td style="padding-left:18px"><span class="dot" style="background:${CATEGORIES[r.c].color};margin-right:6px"></span>${esc(CATEGORIES[r.c].label)}</td><td>${r.n}</td><td>${fmt(r.ar)}</td><td>${fmt(r.avg)}</td><td>${peak > 0 ? fmt(r.dens) : "—"}</td>
          <td><div class="bar" title="измерена ${r.q.m} · по сграда ${r.q.b} · типична ${r.q.t}"><i style="width:${r.q.m / r.n * 100}%;background:var(--accent)"></i><i style="width:${r.q.b / r.n * 100}%;background:color-mix(in srgb, var(--accent) 45%, var(--chip))"></i><i style="width:${r.q.t / r.n * 100}%;background:var(--warn);opacity:.55"></i></div></td></tr>`).join(""); }).join("") || '<tr><td colspan="6">Няма обекти.</td></tr>'}</tbody>
      </table></div>
      <p class="note">Точност: тъмно — измерена от контура или потвърдена; светло — изведена от сградата; оранжево — типична площ за бранша (най-груба оценка). „м² / 1000 гости“ показва колко търговска площ от бранша се пада на 1000 гости в пика; полезно е за сравнение между зони и браншове${useNsi ? ". Гостите са за курорта в границите на НСИ, а обектите — за зоната на картата; сравнявай само зони, които съвпадат с курорта" : ""}.</p>
      ${calibrationTable()}</div>
      <div class="card"><h2>Вериги в избора</h2>${brands.length ? `<table><tbody>${brands.map(([b, n]) => `<tr><td>${esc(b)}</td><td>${n}</td></tr>`).join("")}</tbody></table>` : '<p class="note">Няма марки с 2+ обекта в избора.</p>'}</div>
    </div>
    ${coverageCard(a, list, C)}
    ${R ? nsiCard(a, R, S) : manualCard(a)}
    <p class="note" style="margin:0">Карта: Esri, CARTO. Данни: © участниците в OpenStreetMap (ODbL), НСИ. Безплатните публични услуги са за лична и лека употреба; за работа с клиенти виж Настройки → Карта и данни.</p>`;

  // Докато плъзгачът се влачи, се сменя само процентът; анализът (и с него плъзгачът) се рисува наново при пускане
  if ($("occ")) {
    $("occ").oninput = (e) => { $("occPct").textContent = Math.round(e.target.value * 100) + "%"; };
    $("occ").onchange = (e) => { state.occ = +e.target.value; saveUI(); renderAnalysis(filtered()); $("occ").focus(); };
  }
  if ($("nsiYear")) $("nsiYear").onchange = (e) => { state.nsiYear = +e.target.value; renderAnalysis(filtered()); };
  if ($("nsiOpen")) $("nsiOpen").onclick = nsiDialog;
  bindCoverage(a, list);
  if ($("tAdd")) {
    $("tAdd").onclick = () => {
      const y = parseInt($("tYear").value, 10), n = parseInt($("tNights").value, 10) || 0, p = parseInt($("tArr").value, 10) || 0;
      if (!y || (!n && !p)) { $("tYear").focus(); return; }
      a.tourism = a.tourism.filter((r) => r.year !== y).concat({ year: y, nights: n, arrivals: p, source: $("tSrc").value.trim() });
      persist(); renderAnalysis(filtered());
    };
    $("ttab").querySelectorAll("[data-del]").forEach((b) => b.onclick = () => { a.tourism.sort((x, y) => x.year - y.year).splice(+b.dataset.del, 1); persist(); renderAnalysis(filtered()); });
  }
}

function calibrationTable() {
  const rows = METHODS.map((m) => ({ m, ...CAL[m] }));
  const any = rows.some((r) => r.n);
  return `<details style="margin-top:8px"><summary class="meta" style="cursor:pointer">Калибровка на площта${any ? "" : " (още няма потвърдени площи)"}</summary>
    <p class="note">Като потвърдиш реалната площ на обект (щракни го → „Потвърди“), системата сравнява модела с действителността. След ${CAL_MIN} потвърждения за даден метод диапазоните се изчисляват от реалната грешка, а не от предположение.</p>
    <div class="scroll"><table><thead><tr><th>Метод</th><th>Потвърдени</th><th>Средна грешка</th><th>Моделът дава</th><th>Диапазон ±</th></tr></thead><tbody>
    ${rows.map((r) => `<tr><td>${esc(r.m)}</td><td>${r.n}</td><td>${r.n ? Math.round(r.err * 100) + "%" : "—"}</td><td>${r.n ? (r.bias >= 1 ? "+" : "") + Math.round((r.bias - 1) * 100) + "% спрямо реалната" : "—"}</td><td>${r.n >= CAL_MIN ? Math.round(Math.max(0.05, r.err) * 100) + "% (измерено)" : Math.round(DEFAULT_ERR[r.m] * 100) + "% (предположение)"}</td></tr>`).join("")}
    </tbody></table></div></details>`;
}

    <p class="note" style="margin-top:0">OpenStreetMap рядко познава всички обекти. Обиколи един участък на място, приближи картата точно до него и запиши колко обекта от избраните браншове има реално. Няколко проби в различни части на зоната дават процент покритие, с който се коригират броят и площта.</p>

    ${a.samples.length ? `<div class="scroll" style="margin-top:10px"><table><thead><tr><th>Участък</th><th>На картата</th><th>Реално</th><th>Покритие</th><th>Дата</th><th></th></tr></thead><tbody>
      ${a.samples.map((x, i) => `<tr><td>${esc(x.note || "проба " + (i + 1))}</td><td>${x.osm}</td><td>${x.real}</td><td>${Math.round(Math.min(1, x.osm / x.real) * 100)}%</td><td>${esc(x.date)}</td><td><button class="linkbtn" data-show="${i}">покажи</button> · <button class="linkbtn" data-sdel="${i}">изтрий</button></td></tr>`).join("")}
      </tbody></table></div>` : ""}
    ${C ? `<p class="note">Общо покритие: OSM познава ${C.osm} от ${C.real} проверени обекта (${Math.round(C.rate * 100)}%). Една проба е слаб показател; добре е пробите да са поне 3, в различни части на зоната.</p>` : ""}
  </div>`;

let sampleLayer;
function drawSamples(a) {
  if (!sampleLayer) sampleLayer = L.layerGroup().addTo(map);
  sampleLayer.clearLayers();
  (a.samples || []).forEach((x) => L.rectangle([[x.bbox[0], x.bbox[1]], [x.bbox[2], x.bbox[3]]], { color: "#a1620f", weight: 1.5, dashArray: "5 4", fill: false, interactive: false }).addTo(sampleLayer));
}
function bindCoverage(a, list) {
  const count = () => { const b = map.getBounds(), bb = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()]; return [list.filter((s) => inBounds(s, bb)).length, bb]; };
  const upd = () => { if ($("cvOsm")) $("cvOsm").textContent = count()[0]; };
  upd(); map.off("moveend", window.__cvUpd); window.__cvUpd = upd; map.on("moveend", upd);
  $("cvAdd").onclick = () => {
    const real = parseInt($("cvReal").value, 10); if (!(real > 0)) { $("cvReal").focus(); return; }
    const [osm, bb] = count();
    a.samples.push({ bbox: bb.map((x) => +x.toFixed(5)), osm, real, note: $("cvNote").value.trim(), cats: [...state.cats], date: new Date().toLocaleDateString("bg-BG") });
    persist(); renderAnalysis(filtered());
  };
  $("analysis").querySelectorAll("[data-sdel]").forEach((b) => b.onclick = () => { a.samples.splice(+b.dataset.sdel, 1); persist(); renderAnalysis(filtered()); });
  $("analysis").querySelectorAll("[data-show]").forEach((b) => b.onclick = () => { const x = a.samples[+b.dataset.show].bbox; map.fitBounds([[x[0], x[1]], [x[2], x[3]]]); window.scrollTo({ top: 0, behavior: "smooth" }); });
}

function nsiCard(a, R, S) {
  if (!S) return `<div class="card"><h2>НСИ · ${esc(a.nsiResort)}</h2><p class="note">Във файловете няма годишни нощувки за този курорт.</p></div>`;
  const yearsBars = S.years.map((y) => ({ l: String(y), v: R.annual[y].nights, hi: y === S.Y }));
  const mYears = [...new Set(Object.keys(R.monthly).map((k) => +k.slice(0, 4)))].sort((a, b) => b - a);
  const qYears = [...new Set(Object.keys(R.quarterly).map((k) => +k.slice(0, 4)))].sort((a, b) => b - a);
  const allSub = [...mYears, ...qYears.filter((y) => !mYears.includes(y))].sort((a, b) => b - a);
  const sy = allSub.includes(state.nsiYear) ? state.nsiYear : (allSub.includes(S.Y) ? S.Y : allSub[0]);
  let subBars = [];
  if (mYears.includes(sy)) { for (let m = 1; m <= 12; m++) { const v = R.monthly[`${sy}-${String(m).padStart(2, "0")}`]; if (v && v.nights) subBars.push({ l: MONTHS[m - 1], v: v.nights, hi: false }); } }
  else for (let q = 1; q <= 4; q++) { const v = R.quarterly[`${sy}-Q${q}`]; if (v && v.nights) subBars.push({ l: `Q${q}`, v: v.nights, hi: false }); }
  if (subBars.length) { const mx = Math.max(...subBars.map((b) => b.v)); subBars.forEach((b) => b.hi = b.v === mx); }
  const y = S.y, rev = y.revenue != null ? `${short(y.revenue)} ${esc(y.revenue_unit || "")}` : "—";
  const tableYears = [...S.years].reverse();
  return `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:baseline"><h2 style="margin:0">НСИ · ${esc(a.nsiResort)}</h2><button class="linkbtn" id="nsiOpen">смени или обнови данните</button></div>

function progress(t) { $("progress").hidden = !t; if (t) $("progressText").textContent = t; }
async function collect(id, name, bbox) {
  if (state.busy) return; state.busy = true;
  document.querySelectorAll("header .btn").forEach((b) => b.disabled = true);
  $("welcome").hidden = true;
  try {
    map.fitBounds([[bbox[0], bbox[1]], [bbox[2], bbox[3]]]);
    const osm = await fetchOverpass(bbox, progress);
    const res = processOsm(osm, bbox);
    const prev = DB.areas[id];
    // запазва ръчно добавените (CSV) обекти, туристическите данни и пробите за покритие при обновяване
    if (prev) {
      const old = new Map(prev.shops.map((x) => [x.id, x]));
      for (const sh of res.shops) {
        const o = old.get(sh.id);
        if (o && o.area_true > 0) Object.assign(sh, { area_true: o.area_true, prev: { area: sh.area, conf: sh.area_conf, note: sh.area_note }, area: o.area_true, area_conf: "потвърдена", area_note: "въведена ръчно" });
      }
    }
    if (prev) mergeInto(res.shops, prev.shops.filter((s) => !s.id.startsWith("osm:")).map((s) => Object.assign({}, s, { sources: [...s.sources] })));
    DB.areas[id] = Object.assign({ nsiResort: prev?.nsiResort ?? guessResort(name), name, bbox, collected: new Date().toLocaleString("bg-BG", { dateStyle: "short", timeStyle: "short" }), tourism: prev?.tourism || [], samples: prev?.samples || [], ntr: prev?.ntr || null }, res);
    if (DB.areas[id].ntr) applyNtr(DB.areas[id]);
    if (DB.settings.overture !== false) {
      try { const o = await overtureAdd(DB.areas[id], progress); toastMeta(`Overture: +${o.added} обекта, ${o.matched} съвпадения`); }
      catch (e) { DB.areas[id].overture = { error: String(e.message || e) }; }
    }
    try { await chainsAdd(DB.areas[id], progress); } catch (e) {}
    if (DB.settings.proxy && DB.settings.proxyKey) { progress("Проверка на сайтовете…"); await enrichArea(DB.areas[id], progress); }
    DB.demo = false; state.area = id; saveUI(); persist(); CAL = calibration();
    progress(""); loadArea();
    toastMeta(`${name}: ${res.shops.length} обекта в браншовете, ${res.stays.length} места за настаняване`);
  } catch (e) {
    progress(""); toastMeta(e.message); if (!Object.keys(DB.areas).length) $("welcome").hidden = false;
  } finally {
    state.busy = false; fillAreaSelect(); $("btnNew").disabled = false; $("btnSettings").disabled = false;
  }
}

/* KML / KMZ / GeoJSON: точки (или центърът на полигон) с име, описание и папка */
async function readGeoFile(f) {
  const name = f.name.toLowerCase();
  if (name.endsWith(".geojson") || name.endsWith(".json")) {
    const j = JSON.parse(await f.text());
    return (j.features || []).map((ft) => {
      const g = ft.geometry || {}, p = ft.properties || {};
      let c = null;
      if (g.type === "Point") c = g.coordinates;
      else if (g.type === "Polygon") { const r = g.coordinates[0]; c = [r.reduce((t, x) => t + x[0], 0) / r.length, r.reduce((t, x) => t + x[1], 0) / r.length]; }
      return c ? { name: p.name || p.Name || p.title || "", desc: p.description || p.address || "", folder: p.category || "", lon: +c[0], lat: +c[1] } : null;
    }).filter(Boolean);
  }
  let xml;
  if (name.endsWith(".kmz")) {
    if (!window.JSZip) await new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; sc.onload = res; sc.onerror = () => rej(new Error("JSZip не се зареди")); document.head.appendChild(sc); });
    const zip = await JSZip.loadAsync(await f.arrayBuffer());
    const kml = Object.keys(zip.files).find((k) => k.toLowerCase().endsWith(".kml"));
    if (!kml) throw new Error("В KMZ файла няма KML");
    xml = await zip.files[kml].async("string");
  } else xml = await f.text();
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const strip = (h) => new DOMParser().parseFromString(h || "", "text/html").body.textContent.replace(/\s+/g, " ").trim();
  return [...doc.getElementsByTagName("Placemark")].map((pm) => {
    const txt = (tag) => (pm.getElementsByTagName(tag)[0] || {}).textContent || "";
    const coords = txt("coordinates").trim().split(/\s+/).map((c) => c.split(",").map(Number)).filter((c) => c.length >= 2 && isFinite(c[0]) && isFinite(c[1]));
    if (!coords.length) return null;
    const lon = coords.reduce((t, c) => t + c[0], 0) / coords.length, lat = coords.reduce((t, c) => t + c[1], 0) / coords.length;
    let folder = "", el = pm.parentElement;
    while (el && !folder) { if (el.tagName === "Folder") folder = (el.getElementsByTagName("name")[0] || {}).textContent || ""; el = el.parentElement; }
    const ext = [...pm.getElementsByTagName("Data")].map((d) => (d.getAttribute("name") || "") + " " + ((d.getElementsByTagName("value")[0] || {}).textContent || "")).join(" ");
    return { name: txt("name").trim(), desc: strip(txt("description") + " " + ext), folder: folder.trim(), lat, lon };
  }).filter(Boolean);
}

$("fileGeo").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const a = A(), src = f.name.replace(/\.(kml|kmz|geojson|json)$/i, ""), fixedCat = $("gCat") ? $("gCat").value : "auto", brand = $("gBrand") ? $("gBrand").value.trim() : "";
  try {
    const pts = await readGeoFile(f);
    let outside = 0, nocat = 0;
    const recs = [];
    pts.forEach((p, i) => {
      if (p.lat < a.bbox[0] || p.lat > a.bbox[2] || p.lon < a.bbox[1] || p.lon > a.bbox[3]) { outside++; return; }
      const cat = fixedCat !== "auto" ? fixedCat : guessCat(`${brand} ${p.name} ${p.folder} ${p.desc}`);
      if (!cat) { nocat++; return; }
      const typ = CATEGORIES[cat].size[1];
      recs.push({ id: `geo:${src}:${i}`, name: p.name || brand || "(без име)", brand, cat, lat: +p.lat.toFixed(6), lon: +p.lon.toFixed(6),
        address: p.desc.slice(0, 160), phone: "", website: "", hours: "", mall: "", area: typ, area_conf: "типична", area_err: 0.5,
        area_note: "типична площ за бранша", area_model: typ, area_method: "типична", sources: [src], osm_url: "" });
    });
    const [added, matched] = mergeInto(a.shops, recs);
    persist(); loadArea(false);
    if ($("iRes")) $("iRes").innerHTML = `<p class="ok">${f.name}: ${pts.length} точки. В зоната: ${recs.length + nocat} → ${added} нови обекта, ${matched} съвпаднаха с вече намерени.${outside ? ` Извън зоната: ${outside}.` : ""}${nocat ? ` Без разпознат бранш: ${nocat} (избери бранш ръчно и зареди отново).` : ""}</p>`;
  } catch (err) { if ($("iRes")) $("iRes").innerHTML = `<p class="err">Файлът не можа да се прочете: ${esc(err.message || err)}</p>`; }
};
$("fileCsv").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const a = A(), src = f.name.replace(/\.csv$/i, "");
  const [recs, skipped] = csvToRecords(parseCSV(await f.text()), src, a.bbox);
  const [added, matched] = mergeInto(a.shops, recs);
  persist(); loadArea(false);
  if ($("iRes")) $("iRes").innerHTML = `<p class="ok">Прочетени ${recs.length + skipped} реда: ${added} нови обекта, ${matched} съвпаднаха с вече намерени.${skipped ? ` ${skipped} реда пропуснати (липсват координати или бранш, или са извън зоната).` : ""}</p>`;
};

function exportDialog() {
  openModal(`<h3>Експорт</h3>
    <div style="display:grid;gap:10px">
      <button class="btn" id="eCsv">Таблица за Excel (CSV) — само „${esc(A().name)}“</button>
      <button class="btn primary" id="eAi">Данни за AI анализ (JSON) — „${esc(A().name)}“</button>
      <p class="hint" style="margin:-4px 0 4px">За анализ с <a href="kak-e-napraveno.html#umenia">библиотеката с умения</a>.</p>
      <button class="btn" id="eKml">Карта за Google My Maps / Google Earth (KML) — „${esc(A().name)}“</button>
      <button class="btn" id="eJson">Резервно копие на всички зони (JSON)</button>
      <button class="btn" id="eLoad">Зареди резервно копие</button>
      ${window.DEMO_DATA ? '<button class="btn" id="eDemo">Върни демо данните</button>' : ""}
    </div>
    <p class="hint" style="margin-top:12px">Данните се пазят в този браузър. Резервното копие ги пренася на друг компютър или браузър. Настройките (proxy.php, ключът, картата) не влизат в него.</p>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <button class="linkbtn" id="eDel" style="color:var(--bad)">Изтрий зоната „${esc(A().name)}“</button>
    <div id="eConfirm"></div>`, () => {
    $("eCsv").onclick = () => download(`${state.area}.csv`, exportCSV(A()), "text/csv");
    $("eAi").onclick = () => download(`analiz-${state.area}-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(exportAnalysis(A()), null, 1), "application/json");
    $("eKml").onclick = () => download(`${state.area}.kml`, exportKML(A()), "application/vnd.google-earth.kml+xml");
    // Без настройките: ключът за proxy.php не трябва да тръгва с файла
    $("eJson").onclick = () => download(`targovski-obekti-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ areas: DB.areas, nsi: DB.nsi }), "application/json");
    $("eLoad").onclick = () => $("fileJson").click();
    if ($("eDemo")) $("eDemo").onclick = () => {
      $("eConfirm").innerHTML = `<p class="err">Всички зони в този браузър ще бъдат заменени с демо данните. Ако имаш свои данни, първо направи резервно копие.</p><button class="btn" id="eDemoYes">Да, върни демото</button>`;
      $("eDemoYes").onclick = () => { loadDemo(); state.area = DB.ui.area; persist(); closeModal(); CAL = calibration(); loadArea(); };
    };
    $("eDel").onclick = () => {
      $("eConfirm").innerHTML = `<p class="err">Сигурен ли си? Ще се изтрият и импортираните обекти и туристическите данни за зоната.</p><button class="btn" id="eYes">Да, изтрий</button>`;
      $("eYes").onclick = () => { delete DB.areas[state.area]; state.area = Object.keys(DB.areas)[0]; saveUI(); persist(); closeModal(); loadArea(); };
    };
  });
}
$("fileJson").onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!j || !j.areas || typeof j.areas !== "object") throw new Error();
    // Настройките от файла не се взимат: чужд файл иначе може да пренасочи сайтовете и ключа към свой сървър
    const areas = Object.entries(j.areas).map(([id, a]) => [areaId(id), cleanArea(a)]).filter(([, a]) => a);
    if (!areas.length) throw new Error();
    DB.demo = false; for (const [id, a] of areas) DB.areas[id] = a;
    if (j.nsi) DB.nsi = Object.assign(DB.nsi || {}, cleanNsi(j.nsi));
    persist(); CAL = calibration(); closeModal(); loadArea();
    const skipped = Object.keys(j.areas).length - areas.length;
    toastMeta(`Заредени ${areas.length} зони от резервното копие${skipped ? `, ${skipped} пропуснати (повредени)` : ""}. Настройките не се пренасят.`);
  } catch (err) { toastMeta("Файлът не е резервно копие от тази система."); }
};

function settingsDialog() {
  const s = DB.settings;
  openModal(`<h3>Настройки</h3>
    <h2>Проверка на сайтовете на обектите</h2>
    <p class="hint">Браузърът не може сам да чете чужди сайтове. Ако качиш файла <b>proxy.php</b> на свой хостинг, системата ще взима от сайтовете на обектите адрес, телефон, работно време и понякога площ. Без него всичко останало работи.</p>
    <div class="field"><label for="sProxy">Адрес на proxy.php</label><input type="text" id="sProxy" placeholder="https://твоят-сайт.bg/obekti/proxy.php" value="${esc(s.proxy)}"></div>
    <div class="field"><label for="sKey">Ключ (същият като в proxy.php)</label><input type="password" id="sKey" value="${esc(s.proxyKey)}"></div>
    <div id="sRes"></div>
    <h2 style="margin-top:18px">Карта и данни</h2>
    <p class="hint">По подразбиране системата ползва безплатни публични услуги: подложки от Esri и CARTO и сървърите на Overpass за OpenStreetMap. Те са предназначени за лична и лека употреба; условията им ограничават търговската и масовата. Преди работа с клиенти или вериги сложи тук свой доставчик: например MapTiler или Stadia с твой ключ и собствен или платен Overpass сървър.</p>
    <div class="field"><label for="sTile">Адрес на подложка ({z}, {x}, {y})</label><input type="text" id="sTile" placeholder="https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=ТВОЯТ-КЛЮЧ" value="${esc(s.tileUrl || "")}"></div>
    <div class="field"><label for="sTileAttr">Надпис за авторските права на подложката</label><input type="text" id="sTileAttr" placeholder="© MapTiler © OpenStreetMap" value="${esc(s.tileAttr || "")}"></div>
    <label class="toggle" style="margin-bottom:12px"><input type="checkbox" id="sOv" ${s.overture === false ? "" : "checked"}> Допълвай обектите от Overture Maps при събиране (около минута повече)</label>
    <div class="field"><label for="sOver">Собствен Overpass сървър (по желание)</label><input type="text" id="sOver" placeholder="https://моят-сървър/api/interpreter" value="${esc(s.overpass || "")}"></div>
    <div class="row" style="justify-content:space-between;margin-top:6px"><button class="btn" id="sTest">Провери връзката</button><span class="row"><button class="btn" data-close>Отказ</button><button class="btn primary" id="sSave">Запази</button></span></div>`, () => {
    $("sTest").onclick = async () => {
      $("sRes").innerHTML = '<p class="hint">Проверка…</p>';
      try {
        const r = await fetch(`${$("sProxy").value.trim()}?key=${encodeURIComponent($("sKey").value)}&url=${encodeURIComponent("https://www.openstreetmap.org/")}`);
        $("sRes").innerHTML = r.ok ? '<p class="ok">Работи.</p>' : `<p class="err">Proxy-то отговори с грешка ${r.status}${r.status === 403 ? " (грешен ключ)" : ""}.</p>`;
      } catch (e) { $("sRes").innerHTML = '<p class="err">Няма връзка с proxy.php. Провери адреса.</p>'; }
    };
    $("sSave").onclick = () => {
      const tile = $("sTile").value.trim();
      if (tile && !/^https:\/\/.+\{z\}.+\{x\}.+\{y\}/.test(tile.replace("{y}{r}", "{y}"))) { $("sRes").innerHTML = '<p class="err">Адресът на подложката трябва да започва с https:// и да съдържа {z}, {x} и {y}.</p>'; return; }
      const reload = tile !== (s.tileUrl || "");
      s.proxy = $("sProxy").value.trim(); s.proxyKey = $("sKey").value;
      s.tileUrl = tile; s.tileAttr = $("sTileAttr").value.trim(); s.overpass = $("sOver").value.trim(); s.overture = $("sOv").checked;
      persist(); closeModal();
      if (reload) location.reload();
    };
  });
}

/* =====================================================================
   СТАРТ
   ===================================================================== */
if (typeof L === "undefined") {
  document.querySelector(".main").innerHTML = '<div class="empty" style="grid-column:1/-1">Картата не можа да се зареди. Нужна е интернет връзка.</div>';
} else {
  initMap();
  $("area").onchange = () => { state.area = $("area").value; state.brand = ""; $("brand").value = ""; state.sel = null; $("detail").hidden = true; saveUI(); loadArea(); };
  $("all").onclick = () => { state.cats = new Set(Object.keys(CATEGORIES)); renderCats(); render(); };
  $("none").onclick = () => { state.cats.clear(); renderCats(); render(); };
  $("brand").oninput = () => { state.brand = $("brand").value; render(); };
  $("chains").onchange = () => { state.chains = $("chains").checked; render(); };
  $("inmall").onchange = () => { state.inmall = $("inmall").checked; render(); };
  $("showstay").onchange = () => { state.showstay = $("showstay").checked; state.showstay ? stayLayer.addTo(map) : map.removeLayer(stayLayer); };
  state.chains = $("chains").checked; state.inmall = $("inmall").checked; state.showstay = $("showstay").checked;
  if (state.showstay) stayLayer.addTo(map);
  $("btnNew").onclick = newAreaDialog;
  $("btnRefresh").onclick = () => { const a = A(); if (a) collect(state.area, a.name, a.bbox); };
  $("btnImport").onclick = importDialog;
  $("btnExport").onclick = exportDialog;
  $("btnSettings").onclick = settingsDialog;
  $("btnNsi").onclick = nsiDialog;
  $("btnNtr").onclick = ntrDialog;
  $("btnWelcome").onclick = () => collect("slanchev-bryag", ...PRESETS["slanchev-bryag"]);
  migrate(); CAL = calibration(); oppInit(); lyInit();
  loadArea();
  // Първо отваряне без данни: Слънчев бряг се събира сам (OpenStreetMap, Overture, вериги, регистър на хотелите)
  if (!Object.keys(DB.areas).length) { $("welcome").hidden = true; collect("slanchev-bryag", ...PRESETS["slanchev-bryag"]); }
}
</script>
